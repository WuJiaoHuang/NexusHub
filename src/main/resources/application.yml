server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: NexusHub
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nexushub}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&characterSetResults=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:nexushub_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:nexushub_dev}
    database: ${REDIS_DATABASE:0}
    timeout: 3000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:nexushub}
    password: ${RABBITMQ_PASSWORD:nexushub_dev}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2
          max-interval: 5000
  elasticsearch:
    host: ${ELASTICSEARCH_HOST:localhost}
    port: ${ELASTICSEARCH_PORT:19200}

mybatis-plus:
  type-aliases-package: com.nexushub.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.nexushub: info

nexushub:
  security:
    admin-user-ids: ${ADMIN_USER_IDS:}
  cache:
    place-strategy: ${PLACE_CACHE_STRATEGY:PASS_THROUGH}
  search:
    place-index: ${PLACE_SEARCH_INDEX:nexushub_place}
    rebuild-batch-size: ${PLACE_SEARCH_REBUILD_BATCH_SIZE:500}
  registration:
    slots-warmup-enabled: ${EVENT_SLOTS_WARMUP_ENABLED:true}
    publish-confirm-timeout-ms: ${REGISTRATION_PUBLISH_CONFIRM_TIMEOUT_MS:5000}

aliyun:
  oss:
    enabled: ${ALIYUN_OSS_ENABLED:false}
    endpoint: ${ALIYUN_OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    bucket-name: ${ALIYUN_OSS_BUCKET:java-ai-wujiaohuang}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    public-base-url: ${ALIYUN_OSS_PUBLIC_BASE_URL:https://java-ai-wujiaohuang.oss-cn-beijing.aliyuncs.com}
