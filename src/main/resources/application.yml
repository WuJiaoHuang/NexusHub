server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: CampusLink
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campuslink}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&characterSetResults=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:campuslink_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:campuslink_dev}
    database: ${REDIS_DATABASE:0}
    timeout: 3000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:campuslink}
    password: ${RABBITMQ_PASSWORD:campuslink_dev}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2
          max-interval: 5000
  elasticsearch:
    host: ${ELASTICSEARCH_HOST:localhost}
    port: ${ELASTICSEARCH_PORT:19200}

mybatis-plus:
  type-aliases-package: com.campuslink.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.campuslink: info

campuslink:
  cache:
    place-strategy: ${PLACE_CACHE_STRATEGY:PASS_THROUGH}
  search:
    place-index: ${PLACE_SEARCH_INDEX:campuslink_place}
    rebuild-batch-size: ${PLACE_SEARCH_REBUILD_BATCH_SIZE:500}
  registration:
    slots-warmup-enabled: ${EVENT_SLOTS_WARMUP_ENABLED:true}

