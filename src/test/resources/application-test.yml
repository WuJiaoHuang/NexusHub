spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:cityeats;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    schema: classpath:schema-h2.sql
    data: classpath:data-h2.sql
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  redis:
    host: localhost
    port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.cityeats: warn

cityeats:
  seckill:
    stock-warmup-enabled: false
