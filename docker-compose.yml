services:
  mysql:
    image: mysql:8.0
    container_name: nexushub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nexushub_dev}
      MYSQL_DATABASE: nexushub
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - nexushub-mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:6.2
    container_name: nexushub-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-nexushub_dev}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-nexushub_dev}
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - nexushub-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-nexushub_dev} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: nexushub-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-nexushub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-nexushub_dev}
    ports:
      - "${RABBITMQ_PORT:-5673}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - nexushub-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: elasticsearch:7.6.2
    container_name: nexushub-elasticsearch
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
      TZ: Asia/Shanghai
    ports:
      - "${ELASTICSEARCH_PORT:-19200}:9200"
    volumes:
      - nexushub-elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -E 'green|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  nexushub-mysql-data:
    name: ${MYSQL_DATA_VOLUME:-nexushub-mysql-data}
  nexushub-redis-data:
    name: ${REDIS_DATA_VOLUME:-nexushub-redis-data}
  nexushub-rabbitmq-data:
    name: ${RABBITMQ_DATA_VOLUME:-nexushub-rabbitmq-data}
  nexushub-elasticsearch-data:
    name: ${ELASTICSEARCH_DATA_VOLUME:-nexushub-elasticsearch-data}

